name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node --test packages/pi-btw/tests/*.test.ts
      - run: python3 -m unittest discover -s packages/pi-memory/tests -v
      - run: git diff --check
